[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gamification-auth"
version = "0.1.0"
description = "Проверка access-токенов платформы геймификации: общий формат для всех сервисов"
requires-python = ">=3.13"
dependencies = [
    "pyjwt[crypto]==2.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.6",
]

[tool.hatch.build.targets.wheel]
packages = ["gamification_auth"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
