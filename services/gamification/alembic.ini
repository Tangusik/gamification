# Конфигурация alembic сервиса gamification.
#
# Команды запускаются из services/gamification:
#
#   .venv/Scripts/python.exe -m alembic upgrade head
#
# Ключа sqlalchemy.url здесь намеренно НЕТ. Конфигурация сервиса идёт
# только через переменные окружения, а DSN содержит пароль к базе — в
# файле репозитория ему не место. Адрес базы читает alembic/env.py из
# Settings, то есть из GAMIFICATION_DATABASE_URL.

[alembic]
script_location = alembic

# Каталог сервиса в sys.path: env.py импортирует пакет app.
prepend_sys_path = .

path_separator = os

# Ревизии нумеруются вручную (0001_, 0002_, ...): порядок миграций
# читается прямо из листинга каталога, без открытия файлов.

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
