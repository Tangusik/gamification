# Заголовки безопасности, кроме CSP — он отдельным сниппетом
# (csp.conf), не везде и по другой причине, см. его комментарий.
#
# add_header НЕ наследуется в location, который сам объявляет
# add_header (например = /index.html и /assets/ — там уже есть
# Cache-Control): в таком location этот файл нужно подключать через
# include повторно, а не полагаться на server. Поэтому сниппет и
# оформлен файлом, а не строчками в server { }.

# Браузер не должен угадывать MIME по содержимому — единственная
# защита от подсовывания скрипта под видом картинки/текста.
add_header X-Content-Type-Options "nosniff" always;

# Легаси-дублёр frame-ancestors из CSP: старые браузеры без поддержки
# CSP level 2 всё равно получают защиту от кликджекинга.
add_header X-Frame-Options "DENY" always;

# Полный Referrer только на своём происхождении, на чужие домены —
# только origin без пути и query.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Сайт не использует камеру, микрофон и геолокацию — явный запрет
# вместо молчаливого дефолта браузера.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
