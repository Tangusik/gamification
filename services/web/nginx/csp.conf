# CSP — отдельным сниппетом и НЕ на уровне server (П8): dev-only
# Swagger (/docs, nginx/dev/*.conf) грузит swagger-ui с инлайн-скриптом
# инициализации и с CDN, и CSP на server сломала бы его в разработке.
# Подключается только там, где отдаётся HTML и статика фронта: location
# /, = /index.html, /assets/ — те же три, что security-headers.conf.
#
# script-src 'self' без unsafe-inline: собранный dist/index.html
# инлайн-скриптов не содержит — Vite подключает бандл только через
# <script type="module" src="/assets/...">, проверено на текущей сборке
# (C1, 2026-09-14). img-src и font-src разрешают data: — Vite инлайнит
# мелкие ассеты (иконки, мелкие шрифты) base64-строкой прямо в CSS.
# connect-src 'self' — фронт ходит только на свой origin (/api/v1,
# см. web-service/01-structure.md, «Базовый адрес API»), внешних API
# нет. frame-ancestors 'none' и object-src 'none' — сайт никого не
# встраивает и не встраивается сам, Flash/плагинов нет.
# form-action 'self' — формы (например логин) должны отправляться
# только на свой origin, иначе инъекция могла бы переставить action на
# чужой домен и увести введённые данные (L3).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self';" always;
