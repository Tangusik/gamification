# nginx сервиса web: раздача статики SPA + шлюз к API.
#
# Одна инстанция играет две роли сразу — фронт и шлюз. Для одного
# бэкенд-сервиса это правильно, но при появлении второго шлюз придётся
# выделять в отдельный сервис. Поэтому конфиг вынесен отдельным файлом:
# выделение должно стать ПЕРЕНОСОМ файла, а не его переписыванием.
#
# Правила, на которых держится корректность (.claude/knowledge/07-routing.md):
#   - публичный путь отображается на ТОТ ЖЕ путь внутри сервиса;
#   - один location на сервис; знание «какой сервис стоит за префиксом
#     ресурса» живёт только здесь;
#   - всё, что не под /api/, отдаётся как index.html приложения.
#
# Этот же файл работает и в dev (монтируется томом), и в проде (запечён
# в образ) — правки ниже (08c) обязаны не ломать dev-Swagger.

# X-Forwarded-Proto (П11): в проде перед этим nginx стоит Caddy
# (docker-compose.yml, только прод-compose, В1 = H3), TLS снимается
# там. Берём значение от него; если заголовок пуст (dev без Caddy,
# прямой curl мимо прокси) — используем $scheme самого запроса, как и
# раньше. map — директива уровня http; conf.d/*.conf подключается
# nginx.conf именно там, поэтому она здесь легальна вне server { }.
map $http_x_forwarded_proto $x_forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;

    # Не раскрывать версию nginx клиенту — ни в заголовке Server, ни на
    # дефолтных страницах ошибок (П7).
    server_tokens off;

    # По умолчанию nginx достраивает редиректы (301 у try_files на
    # каталог, 302 и т.п.) до абсолютного URL по Host заголовка запроса
    # и своей схеме — в dev это http://127.0.0.1/..., за прод-Caddy без
    # учёта X-Forwarded-Proto получился бы http со своим портом вместо
    # https с доменом (I1). Относительный Location корректен в обоих
    # окружениях и не зависит от X-Forwarded-*.
    absolute_redirect off;

    # gzip выключен в стандартном nginx.conf образа nginx:1.27-alpine.
    # Без него бандл (~351 КБ) уходит несжатым; со сжатием — ~109 КБ
    # (П4). text/html в gzip_types не нужен — модуль жмёт его всегда.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Заголовки исходного запроса — на уровне server: их наследуют все
    # location, которые не переопределяют proxy_set_header сами.
    # Без них бэкенд видит хост "users:8000" и адрес контейнера nginx.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $x_forwarded_proto;

    # Статика фронта.
    root /usr/share/nginx/html;
    index index.html;

    # Шлюз к сервису users.
    #
    # Завершающие слэши обязательны С ОБЕИХ сторон. Со слэшем в
    # proxy_pass nginx заменяет совпавший префикс location на указанный
    # путь: /api/v1/users/me -> /users/me. Без слэша он передал бы URI
    # как есть, запрос ушёл бы на /api/v1/users/me и сервис ответил 404 —
    # опечатка ломает всё и выглядит как «бэкенд не отвечает».
    #
    # Отображение «на тот же путь», а не в корень сервиса, — это
    # единственное, что удерживает /health, /internal и будущий /metrics
    # вне публичного доступа: они лежат вне /users и сюда не попадают.
    # Поэтому отдельных deny для них здесь НЕТ и быть не должно.
    # Появление deny = сигнал, что маппинг сломали.
    # security-headers.conf и csp-api.conf (L2): без них ответы шлюза —
    # включая 401/403 с телом ошибки — уходили в браузер без
    # X-Content-Type-Options и X-Frame-Options, а зеркалит их сюда же
    # error_page ниже, иначе 502/504 от упавшего users отдавались бы
    # голыми. Ловушка на будущее (П15): если этому location добавят
    # add_header Cache-Control (например под ETag/условные запросы),
    # он станет "собственником" набора заголовков, как /assets/ и
    # /index.html, и оба include ниже придётся повторить в том же
    # location — иначе Cache-Control молча вытеснит и security-headers,
    # и CSP.
    location /api/v1/users/ {
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp-api.conf;
        proxy_intercept_errors on;
        error_page 502 504 = @api_error;
        proxy_pass http://users:8000/users/;
    }

    # Шлюз к сервису gamification.
    #
    # Два location, а не один: путь коллекции без завершающего слэша
    # (GET/POST /api/v1/institutions) не совпадает с префиксным
    # /api/v1/institutions/ и без точного (=) location ушёл бы в
    # SPA-fallback ниже — GET получил бы 200 с index.html, POST — 405 от
    # самого nginx (риск 3 плана). У users такой ловушки не было: все
    # его пути имеют сегмент после /users/.
    # Те же include и error_page, что у /api/v1/users/ выше, и та же
    # ловушка про будущий Cache-Control (П15) — см. комментарий там.
    location = /api/v1/institutions {
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp-api.conf;
        proxy_intercept_errors on;
        error_page 502 504 = @api_error;
        proxy_pass http://gamification:8000/institutions;
    }

    location /api/v1/institutions/ {
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp-api.conf;
        proxy_intercept_errors on;
        error_page 502 504 = @api_error;
        proxy_pass http://gamification:8000/institutions/;
    }

    # Общая точка для error_page трёх location выше: "=" без кода
    # сохраняет фактический статус (502 или 504) — сюда попадают до
    # того, как error_page решит, что делать с ним, поэтому одного
    # именованного location достаточно на оба сервиса. Заголовки нужны
    # свои: internal-редирект на error_page — это новый запрос со
    # своим набором add_header, заголовки исходного location в него не
    # переносятся.
    location @api_error {
        internal;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp-api.conf;
    }

    # Точка расширения только для разработки: сюда монтируется фрагмент
    # с dev-only location (Swagger, см. nginx/dev/docs.conf). Шаблон с
    # маской, не совпадающей ни с одним файлом, для nginx допустим —
    # в деплое каталог пуст, и include не даёт ничего.
    #
    # Каталог намеренно НЕ conf.d: файлы conf.d/*.conf подключаются
    # nginx.conf на уровне http, где location недопустим.
    #
    # Стоит ДО SPA-fallback: порядок значим, location / перехватил бы
    # эти пути.
    include /etc/nginx/dev/*.conf;

    # Хэшированные чанки /assets/ (Vite кладёт хэш содержимого в имя
    # файла): кешируются на год как immutable — смена содержимого
    # всегда даёт новое имя. try_files ... =404, а НЕ try_files ... с
    # уходом в SPA-fallback: без =404 отсутствующий после передеплоя
    # чанк отдавал бы 200 index.html вместо 404, и вкладка со старым
    # HTML получала бы разметку под видом JS и падала на разборе (П5).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # add_header выше делает этот location "собственником" набора
        # заголовков — server-level (если бы он был) сюда бы не дошёл.
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
    }

    # index.html без Cache-Control браузер кеширует эвристически по
    # Last-Modified, и после передеплоя старая вкладка ссылается на уже
    # удалённые хэшированные чанки из /assets/ — белый экран до жёсткой
    # перезагрузки. Внутренний редирект из try_files ниже попадает сюда же.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
    }

    # SPA-fallback: любой неизвестный путь отдаёт index.html, роутинг
    # доделывает приложение в браузере. Отсюда же следует, что защита
    # маршрутов обязана жить в роутере фронта — сервер тут не помощник.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/security-headers.conf;
        include /etc/nginx/csp.conf;
    }
}
