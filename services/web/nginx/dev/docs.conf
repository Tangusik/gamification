# DEV ONLY. Swagger сервиса users через шлюз.
#
# Файл монтируется docker-compose.dev.yml в /etc/nginx/dev/ и в образ
# НЕ попадает: в деплое /docs наружу не публикуется — это прямое
# следствие решения убрать публикацию порта users из docker-compose.yml.
#
# Зачем: в dev USERS_ROOT_PATH=/api/v1, то есть ровно как в проде.
# FastAPI при этом по-прежнему отдаёт страницу /docs от корня сервиса,
# но сама страница просит схему по адресу /api/v1/openapi.json. Отсюда
# два ТОЧНЫХ location (=), а не префиксных: лишнего наружу не открываем.
#
# Выигрыш: кнопка «Try it out» бьёт в /api/v1/users/... и попадает
# правильно — Swagger проверяет ровно прод-конфигурацию.
#
# Побочное следствие, ожидаемая цена решения, а НЕ дефект: Swagger по
# прямому порту 127.0.0.1:8000/docs сломается — страница откроется, но
# схему по /api/v1/openapi.json на прямом порту не найдёт. Прямой порт
# остаётся для curl и тестов.

location = /docs {
    proxy_pass http://users:8000/docs;
}

location = /api/v1/openapi.json {
    proxy_pass http://users:8000/openapi.json;
}
