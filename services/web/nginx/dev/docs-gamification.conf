# DEV ONLY. Swagger сервиса gamification через шлюз.
#
# Файл монтируется docker-compose.dev.yml в /etc/nginx/dev/ и в образ
# НЕ попадает: в деплое /docs наружу не публикуется — порт gamification
# из docker-compose.yml не публикуется вовсе.
#
# Адрес /api/v1/openapi.json за шлюзом уже занят users, поэтому у
# gamification свой openapi_url — /openapi-gamification.json (см.
# services/gamification/README.md). Отсюда два ТОЧНЫХ location (=), а
# не префиксных: лишнего наружу не открываем.

location = /docs/gamification {
    proxy_pass http://gamification:8000/docs;
}

location = /api/v1/openapi-gamification.json {
    proxy_pass http://gamification:8000/openapi-gamification.json;
}
