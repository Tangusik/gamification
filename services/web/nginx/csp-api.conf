# CSP для /api/v1/* (L2) — отдельный сниппет, а не csp.conf: эти
# ответы JSON, а не HTML, им не нужны ни script-src/style-src, ни
# исключения под Vite-бандл. default-src 'none' запрещает вообще всё,
# frame-ancestors 'none' дублирует X-Frame-Options на случай, если
# браузер по ошибке попытается открыть JSON-ответ как документ во
# фрейме (например, при неверной настройке Content-Type у бэкенда).
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
